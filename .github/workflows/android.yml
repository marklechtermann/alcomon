name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests und Release-APK bauen
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/hubbell-1.0.${{ github.run_number }}.apk"
          ls -la dist

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hubbell 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Automatisch gebaut aus ${{ github.sha }}.

            **Installieren:** `hubbell-1.0.${{ github.run_number }}.apk` unten auf dem Android-Handy herunterladen und öffnen
            (beim ersten Mal „Installation aus unbekannten Quellen“ erlauben). Neue Versionen lassen sich über die alte drüber installieren.

            Letzte Änderung: ${{ github.event.head_commit.message }}
          files: dist/*.apk
